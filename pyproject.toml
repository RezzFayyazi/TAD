[project]
name = "TAD"
version = "0.1.0"
description = "Topolocial Attribution Distance (TAD) for decoder-only LLMs"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "torch==2.5.1",
    "transformers>=4.40.0",
    "huggingface-hub>=0.20.0",
    "python-dotenv>=1.0.0",
    "numpy>=1.24.0",
    "gudhi>=3.9.0",
    "tiktoken>=0.12.0",
    "sentence-transformers>=2.2.0",
    "scikit-learn>=1.3.0",
    "accelerate"==1.14.0,
    "psutil"==7.2.2,
    "pot==0.9.7",
    "rouge-score>=0.1.2"
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
